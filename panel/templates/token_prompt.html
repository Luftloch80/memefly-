<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>memefly panel &mdash; sign in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="wrap narrow">
    <div class="panel" style="margin-top:15vh;">
      <h2>Enter access token</h2>
      <p class="panel-sub">
        Find the token in the terminal where you ran
        <code>python -m panel.app</code>.
      </p>
      <form onsubmit="event.preventDefault(); window.location = '/?token=' + encodeURIComponent(document.getElementById('t').value);">
        <input id="t" type="password" placeholder="paste token" autofocus style="width:100%;padding:10px;margin-bottom:12px;" />
        <button type="submit" class="btn btn-primary">Continue</button>
      </form>
    </div>
  </div>
</body>
</html>
